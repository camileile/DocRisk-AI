name: Backend - pytest

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Testes da API, motor documental e regras
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -e ".[test]"
      - name: pytest (leitor offline; sem chamadas ao Gemini)
        env:
          AI_PROVIDER: textlayer
        run: pytest -q
      - name: Ambiente conectado com processos reais (D4-04)
        env:
          AI_PROVIDER: textlayer
        run: python scripts/runtime_check.py --json "$RUNNER_TEMP/runtime-check.json"
      - name: Relatorio do ambiente conectado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-check-report
          path: ${{ runner.temp }}/runtime-check.json
          if-no-files-found: ignore
