name: Frontend - TypeScript, build e smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-validation.yml"
  push:
    branches: [feat/web-admin-auditoria, main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, build e navegação
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Build e exportação estática
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      - name: Validar rotas geradas
        run: |
          test -f out/index.html
          test -f out/acesso/index.html
          test -f out/contato/index.html
          test -f out/painel/index.html
          test -f out/painel/conciliacoes/index.html
          test -f out/painel/pareceres/index.html
          test -f out/contratante/index.html
          test -f out/administracao/index.html
      - name: Playwright e Chromium (somente testes)
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Servidor da exportação estática
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/docrisk-static.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/docrisk-static.log
          exit 1
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: API real (leitor offline, modo demonstração)
        working-directory: api
        env:
          AI_PROVIDER: textlayer
          DOCRISK_DEMO_MODE: "1"
          DOCRISK_DATA_DIR: /tmp/docrisk-ci-data
          CORS_ORIGINS: http://127.0.0.1:4173
        run: |
          pip install -e .
          python -m uvicorn docrisk_core.api:app --host 127.0.0.1 --port 8000 > /tmp/docrisk-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/docrisk-api.log
          exit 1
      - name: Teste ponta a ponta por perfil (front + API)
        run: node scripts/smoke.cjs
